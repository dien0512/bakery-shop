quarkus.application.name=ai-service
quarkus.http.port=8085

mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=${JWT_ISSUER:bakery-shop}

quarkus.rest-client.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
quarkus.rest-client.product-service.scope=jakarta.inject.Singleton
quarkus.rest-client.product-service.connect-timeout=2000
quarkus.rest-client.product-service.read-timeout=3000

quarkus.rest-client.openai.url=https://api.openai.com
quarkus.rest-client.openai.scope=jakarta.inject.Singleton
quarkus.rest-client.openai.connect-timeout=3000
quarkus.rest-client.openai.read-timeout=${OPENAI_TIMEOUT_SECONDS:8}000

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.6-luna}
openai.reasoning-effort=${OPENAI_REASONING_EFFORT:none}
openai.max-output-tokens=${OPENAI_MAX_OUTPUT_TOKENS:800}
ai.concierge.enabled=${AI_CONCIERGE_ENABLED:true}
ai.max-candidates=${AI_MAX_CANDIDATES:20}
ai.max-recommendations=${AI_MAX_RECOMMENDATIONS:3}

quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, OPTIONS

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi
mp.openapi.extensions.smallrye.info.title=AI Bakery Concierge API
mp.openapi.extensions.smallrye.info.version=1.0.0

quarkus.log.level=INFO
quarkus.log.category."com.example".level=DEBUG
