# Port của gateway
quarkus.http.port=8080

# URL các service backend
quarkus.rest-client."com.example.gateway.client.UserServiceClient".url=http://localhost:8081
quarkus.rest-client."com.example.gateway.client.ProductServiceClient".url=http://localhost:8082
quarkus.rest-client."com.example.gateway.client.OrderServiceClient".url=http://localhost:8083
quarkus.rest-client."com.example.gateway.client.NotificationServiceClient".url=http://localhost:8084
quarkus.rest-client."com.example.gateway.client.AiServiceClient".url=http://localhost:8085

# Timeout (ms)
quarkus.rest-client.connect-timeout=5000
quarkus.rest-client.read-timeout=30000

# CORS (nếu frontend gọi trực tiếp)
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# Swagger
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Bakery Shop API Gateway
quarkus.smallrye-openapi.info-version=1.0.0

# Dev
quarkus.http.host=0.0.0.0
