# =============================================
# APPLICATION
# =============================================
quarkus.application.name=notification-service
quarkus.http.port=8084

# =============================================
# DATASOURCE (MYSQL) - notification_db
# =============================================
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME:root}
quarkus.datasource.password=${DB_PASSWORD:changeme}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3307/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.devservices.enabled=false

# =============================================
# HIBERNATE ORM
# =============================================
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
quarkus.hibernate-orm.packages=com.example.entity

# =============================================
# BEAN VALIDATION
# =============================================
quarkus.hibernate-validator.fail-fast=false

# =============================================
# JWT (verify only - dùng publicKey từ user-service)
# =============================================
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=${JWT_ISSUER:bakery-shop}

# =============================================
# KAFKA
# =============================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer: nhận event từ các service khác (orders-service, user-service...)
mp.messaging.incoming.notification-events.connector=smallrye-kafka
mp.messaging.incoming.notification-events.topic=notification-events
mp.messaging.incoming.notification-events.group.id=notification-service
mp.messaging.incoming.notification-events.value.deserializer=com.example.consumer.NotificationEventDeserializer
mp.messaging.incoming.notification-events.auto.offset.reset=earliest
mp.messaging.incoming.notification-events.enable.auto.commit=true
mp.messaging.incoming.notification-events.failure-strategy=ignore

# =============================================
# CORS
# =============================================
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, PATCH, DELETE, OPTIONS

# =============================================
# OPENAPI / SWAGGER UI
# =============================================
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.smallrye-openapi.security-scheme-description=JWT Bearer Token (role: USER | ADMIN)

mp.openapi.extensions.smallrye.info.title=Notification Service API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Dich vu gui thong bao Email/SMS cho Bakery Shop
mp.openapi.extensions.smallrye.info.contact.name=Bakery Shop Team

# =============================================
# LOGGING
# =============================================
quarkus.log.level=INFO
quarkus.log.category."com.example".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{3.}] (%t) %s%e%n

