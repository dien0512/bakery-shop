# Override for testing - dùng H2 in-memory thay MySQL
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:notification_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Disable Kafka in test (no broker)
mp.messaging.incoming.notification-events.connector=smallrye-in-memory

# Disable JWT in test
quarkus.security.auth.enabled-in-dev-mode=false
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=bakery-shop

# Email disabled
mail.enabled=false
