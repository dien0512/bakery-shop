# =============================================
# FRONTEND
# =============================================
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

quarkus.rest-client.user-service.connect-timeout=3000
quarkus.rest-client.user-service.read-timeout=3000

# =============================================
# KAFKA PRODUCER
# =============================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.outgoing.order-created.connector=smallrye-kafka
mp.messaging.outgoing.order-created.topic=order.created
mp.messaging.outgoing.order-created.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.order-paid.connector=smallrye-kafka
mp.messaging.outgoing.order-paid.topic=order.paid
mp.messaging.outgoing.order-paid.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.order-status-updated.connector=smallrye-kafka
mp.messaging.outgoing.order-status-updated.topic=order.status.updated
mp.messaging.outgoing.order-status-updated.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.order-cancelled.connector=smallrye-kafka
mp.messaging.outgoing.order-cancelled.topic=order.cancelled
mp.messaging.outgoing.order-cancelled.value.serializer=org.apache.kafka.common.serialization.StringSerializer

