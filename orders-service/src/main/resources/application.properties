# =============================================
# APPLICATION
# =============================================
quarkus.application.name=orders-service
quarkus.http.port=8083

# =============================================
# DATASOURCE (MYSQL)
# =============================================
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=@Nhd05122005
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/orders_db}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.devservices.enabled=false

# =============================================
# HIBERNATE ORM
# =============================================
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# =============================================
# VALIDATION
# =============================================
quarkus.hibernate-validator.fail-fast=false

# =============================================
# JWT (verify only - dung publicKey tu user-service)
# =============================================
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=${JWT_ISSUER:bakery-shop}

# =============================================
# REST CLIENT -> product-service
# =============================================
quarkus.rest-client.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
quarkus.rest-client.product-service.scope=jakarta.inject.Singleton

# =============================================
# CORS
# =============================================
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, PATCH, DELETE, OPTIONS

# =============================================
# OPENAPI / SWAGGER
# =============================================
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi

mp.openapi.extensions.smallrye.info.title=Orders Service API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Order management service

# =============================================
# LOGGING
# =============================================
quarkus.log.level=INFO
quarkus.log.category."com.example".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{3.}] (%t) %s%e%n

# =============================================
# VNPAY
# Lấy thông tin từ: https://sandbox.vnpayment.vn/devreg/
# =============================================
vnpay.tmn-code=${VNPAY_TMN_CODE:JLUZ0U8H}
vnpay.hash-secret=${VNPAY_HASH_SECRET:MCXS9MB7NGZWATPQ95J8NX6AWUCYC41F}
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8083/api/payment/vnpay-return}

# REST Client → user-service (để lấy email/phone khi gửi notification)
quarkus.rest-client.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
quarkus.rest-client.user-service.scope=jakarta.inject.Singleton

