services:

  # ============================================================
  # INFRASTRUCTURE
  # ============================================================

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "@Nhd05122005"
      MYSQL_DATABASE: users_db        # tạo sẵn 1 db, còn lại init bằng script
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - bakery-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p@Nhd05122005"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bakery-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - bakery-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ============================================================
  # MICROSERVICES
  # ============================================================

  user-service:
    build:
      context: ./user-service
      dockerfile: src/main/docker/Dockerfile.jvm
      args:
        PORT: 8081
    container_name: user-service
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/users_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_ISSUER: bakery-shop
    ports:
      - "8081:8081"
    networks:
      - bakery-network

  product-service:
    build:
      context: ./product-service
      dockerfile: src/main/docker/Dockerfile.jvm
      args:
        PORT: 8082
    container_name: product-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      JWT_ISSUER: bakery-shop
    ports:
      - "8082:8082"
    networks:
      - bakery-network

  orders-service:
    build:
      context: ./orders-service
      dockerfile: src/main/docker/Dockerfile.jvm
      args:
        PORT: 8083
    container_name: orders-service
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      product-service:
        condition: service_started
      user-service:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/orders_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_ISSUER: bakery-shop
      PRODUCT_SERVICE_URL: http://product-service:8082
      USER_SERVICE_URL: http://user-service:8081
      VNPAY_RETURN_URL: http://localhost:8083/api/payment/vnpay-return
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8083:8083"
    networks:
      - bakery-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: src/main/docker/Dockerfile.jvm
      args:
        PORT: 8084
    container_name: notification-service
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      DB_USERNAME: root
      DB_PASSWORD: "@Nhd05122005"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_ISSUER: bakery-shop
    ports:
      - "8084:8084"
    networks:
      - bakery-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: src/main/docker/Dockerfile.jvm
      args:
        PORT: 8080
    container_name: api-gateway
    depends_on:
      - user-service
      - product-service
      - orders-service
      - notification-service
    ports:
      - "8080:8080"
    networks:
      - bakery-network

# ============================================================
# VOLUMES & NETWORKS
# ============================================================

volumes:
  mysql_data:

networks:
  bakery-network:
    driver: bridge