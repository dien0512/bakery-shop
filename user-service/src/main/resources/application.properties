# =============================================
# APPLICATION
# =============================================
quarkus.application.name=user-service
quarkus.http.port=8081

# =============================================
# DATASOURCE (MYSQL)
# =============================================
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=@Nhd05122005
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/users_db}

quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=5

# DEV SERVICES (tắt đi nếu đã có MySQL thật, bật thì Quarkus sẽ dùng Docker)
quarkus.datasource.devservices.enabled=false

# =============================================
# HIBERNATE ORM
# =============================================
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# =============================================
# VALIDATION
# =============================================
quarkus.hibernate-validator.fail-fast=false

# =============================================
# JWT
# FIX: smallrye.jwt.new-token.issuer phải khớp với mp.jwt.verify.issuer
#      JwtService dùng 'smallrye.jwt.new-token.issuer' để sign,
#      Quarkus verify dùng 'mp.jwt.verify.issuer'.
#      Nếu hai giá trị khác nhau → token verify fail → 401/500.
# =============================================
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=${JWT_ISSUER:bakery-shop}

smallrye.jwt.sign.key.location=privateKey.pem

# FIX: Thêm key này để JwtService inject đúng — nếu thiếu thì accessTokenLifespan = 0
smallrye.jwt.new-token.lifespan=3600
smallrye.jwt.new-token.issuer=${JWT_ISSUER:bakery-shop}

app.jwt.refresh-lifespan=${JWT_REFRESH_EXPIRY:604800}

# =============================================
# CORS
# =============================================
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, PATCH, DELETE, OPTIONS

# =============================================
# OPENAPI
# =============================================
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi

mp.openapi.extensions.smallrye.info.title=User Service API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=User management service

# =============================================
# LOGGING
# =============================================
quarkus.log.level=INFO
quarkus.log.category."com.example".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{3.}] (%t) %s%e%n

# =============================================
# KAFKA
# =============================================
#kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

## Producer: gửi notification events
#mp.messaging.outgoing.notification-events.connector=smallrye-kafka
#mp.messaging.outgoing.notification-events.topic=notification-events
#mp.messaging.outgoing.notification-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
#mp.messaging.outgoing.notification-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# =============================================
# KAFKA PRODUCER
# =============================================
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mp.messaging.outgoing.user-registered.connector=smallrye-kafka
mp.messaging.outgoing.user-registered.topic=user.registered
mp.messaging.outgoing.user-registered.value.serializer=org.apache.kafka.common.serialization.StringSerializer


quarkus.security.jaxrs.deny-unannotated-endpoints=false